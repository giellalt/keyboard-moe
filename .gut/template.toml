# This template merge config file lists:
#
# - name: name of template stuff
# - patterns: strings to do text substitution on
# - rev_id: a sequential revision id of the template repo (manually maintained for now)
# - required: a full list of all files always merged
# - optional: a full list of all files merged when the --optional flag is used with `gut template`
# - ignored: never used in merging, only when populating new repos

name = "Keyboard Template"
patterns = ["moe", "moe", "Innu",
            "LGPLv3", "mont1268"]
rev_id = 33
required = [".gitignore",
            ".github/workflows/docs.yml",
            ".glottologid.txt",
            "Makefile.am",
            "autogen.sh",
            "configure.ac",
            "docs/.gitignore",
            "docs/_config.yml",
            "docs/Gemfile",
            "docs/requirements.txt",
            "docs/scripts/generate-layout-docs.py"]

optional = [".github/workflows/build.yml",
            "AUTHORS",
            "README.md",
            "moe.kbdgen/layouts/moe.yaml",
            "moe.kbdgen/layouts/en.yaml",
            "moe.kbdgen/project.yaml",
            "moe.kbdgen/resources/mac/background.png",
            "moe.kbdgen/resources/mac/icon.moe.png",
            "moe.kbdgen/resources/mac/readme.html",
            "moe.kbdgen/targets/android.yaml",
            "moe.kbdgen/targets/ios.yaml",
            "moe.kbdgen/targets/mac.yaml",
            "moe.kbdgen/targets/win.yaml",
            "docs/index.md",
            "docs/layout.md"]

ignored  = ["LICENSE"]
